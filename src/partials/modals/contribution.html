<div class="modal-backdrop hidden" id="contributionModal" role="dialog" aria-modal="true" aria-labelledby="contributionTitle">
  <div class="modal modal-sm panel">
    <button class="modal-close" type="button" data-close-modal aria-label="Fechar">×</button>
    <div class="eyebrow">APORTE</div>
    <h2 id="contributionTitle">Adicionar aporte</h2>
    <p id="contributionLead"></p>

    <form id="contributionForm" class="stack-form">
      <input type="hidden" name="id">
      <label>Valor do aporte (R$)
        <input name="amount" type="number" min=".01" step=".01" required placeholder="250">
      </label>
      <button class="text-btn" type="button" id="fillRemaining">Preencher o que falta para a meta</button>
      <button class="apply-btn full-btn" type="submit">Registrar aporte ↗</button>
    </form>
  </div>
</div>
