<header class="topbar">
  <div>
    <div class="eyebrow">SEU PAINEL FINANCEIRO</div>
    <h1 id="pageTitle"><span id="pageTitleText"></span> <span class="wave" id="pageWave">✦</span></h1>
    <p class="subhead">Uma visão tranquila e inteligente do seu dinheiro.</p>
  </div>

  <div class="top-actions">
    <label class="upload-btn" for="excelFile">↑ <span>Importar Excel</span></label>
    <input id="excelFile" type="file" accept=".xlsx,.xls,.csv" hidden>
    <button id="privacyToggle" class="icon-btn" type="button" title="Ocultar valores" aria-label="Ocultar valores" aria-pressed="false">◉</button>
    <button id="exportExcel" class="icon-btn" type="button" title="Exportar dados para Excel" aria-label="Exportar dados para Excel" data-data-action="export-excel">⇩</button>
    <a class="avatar top-avatar" id="topAvatar" href="#profile" aria-label="Abrir perfil"></a>
  </div>
</header>
